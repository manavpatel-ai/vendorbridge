version: "3.9"

services:
  # ───── Backend (FastAPI + Uvicorn) ─────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vendorbridge-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Override CORS to allow the frontend container
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://localhost:5173,http://127.0.0.1
    volumes:
      # Persist uploaded files (invoices, attachments)
      - backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ───── Frontend (React + Vite → Nginx) ─────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Point Vite at the backend via the Nginx proxy
        VITE_API_URL: http://localhost:8000
    container_name: vendorbridge-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_uploads:
